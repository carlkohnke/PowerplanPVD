[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sputterplan"
version = "0.2.0"
description = "Create practical multi-target magnetron sputtering operation plans from composition gradients."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Carl A. Kohnke" }]
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "openpyxl>=3.1",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["hypothesis>=6.0", "pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.8", "scipy>=1.12"]

[project.scripts]
sputterplan = "sputterplan.cli:main"
sputterplan-gui = "sputterplan.gui:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sputterplan"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
